name: Send Project Reminders

on:
  schedule:
    # Hourly on weekdays, 09:00–23:00 Tbilisi (05:00–19:00 UTC).
    # The script decides what to send from the schedule stored in data.json,
    # so changing the times in the app does not need a workflow edit.
    - cron: '0 5-19 * * 1-5'
  workflow_dispatch:  # allow manual trigger from GitHub

permissions:
  contents: write   # needed to commit updated lastSent back to data.json

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send reminders
        run: node check_reminders.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated timestamps
        run: |
          git config user.name  "Projects Bot"
          git config user.email "bot@noreply.github.com"
          git add data.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update reminder timestamps"
          # the browser pushes to data.json too — rebase before pushing
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
